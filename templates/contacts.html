<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Contacts - Gift List</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Manage Contacts</h1>
  </header>

  <main>
    <div id="app-nav-mount"></div>

    <div id="page-message" class="page-message hidden"></div>

    <div id="contact-rows"></div>

    <form id="add-contact-form" class="contact-row new-contact-row">
      <input type="text" id="new-contact-first-name" placeholder="First name" required />
      <input type="text" id="new-contact-last-name" placeholder="Last name" />
      <input type="email" id="new-contact-email" placeholder="Email" />
      <input type="text" id="new-contact-address" placeholder="Address" />
      <button type="submit">Add contact</button>
    </form>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="/nav.js"></script>
  <script src="/contacts.js"></script>
</body>
</html>
