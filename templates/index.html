<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lists</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Home screen / installed-app support -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b8863b" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lists" />
</head>
<body>
  <header class="app-header">
    <h1>Lists</h1>
  </header>

  <main>
    <div id="app-nav-mount"></div>

    <div id="page-message" class="page-message hidden"></div>

    <button id="show-add-list" type="button" class="add-toggle">+ Add List</button>

    <form id="new-list-form" class="add-card hidden">
      <div class="field">
        <label for="new-name">Name <span class="required">*</span></label>
        <input id="new-name" name="name" type="text" required placeholder="e.g. Gifts" />
      </div>
      <div class="field">
        <label for="new-purpose">Purpose</label>
        <textarea id="new-purpose" name="purpose" rows="2" placeholder="What is this list for?"></textarea>
      </div>
      <div class="item-actions">
        <button type="submit" class="save-btn">Add list</button>
        <button type="button" id="cancel-add-list" class="cancel-btn">Cancel</button>
      </div>
    </form>

    <section>
      <div class="list-header">
        <h2>All lists</h2>
        <span id="list-count" class="list-count"></span>
        <div class="list-controls">
          <div id="category-filter-mount"></div>
          <label class="sort-control">Sort
            <select id="lists-sort" aria-label="Sort lists">
              <option value="category">By category</option>
              <option value="manual">Manual (flat)</option>
            </select>
          </label>
        </div>
      </div>
      <div id="lists-list" class="item-list"></div>
      <p id="empty-state" class="empty-state" hidden>No lists yet - add one above to get started.</p>
    </section>
  </main>

  <!-- Drag-to-reorder inside an expanded list; same pinned CDN build as the list page. -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="nav.js"></script>
  <script src="common.js"></script>
  <script src="lists.js"></script>
</body>
</html>
